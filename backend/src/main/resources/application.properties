# ==========================================
# DELIVERY PGE — Application Properties
# ==========================================

spring.application.name=delivery-pge

# ==========================================
# DATABASE — PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_pge
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=delivery-pge-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# ==========================================
# DELIVERY CONFIGURATION
# ==========================================
delivery.base-fee=5.00
delivery.price-per-km=2.50
delivery.max-distance-km=30.0

# ==========================================
# EXTERNAL APIs
# ==========================================
external.nominatim.url=https://nominatim.openstreetmap.org
external.osrm.url=https://router.project-osrm.org
external.api.timeout-seconds=10

# ==========================================
# CORS
# ==========================================
cors.allowed-origins=http://localhost:4200

# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# SWAGGER
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
