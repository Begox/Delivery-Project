# Test properties — uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=delivery-pge-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

delivery.base-fee=5.00
delivery.price-per-km=2.50
delivery.max-distance-km=30.0

external.nominatim.url=https://nominatim.openstreetmap.org
external.osrm.url=https://router.project-osrm.org
external.api.timeout-seconds=5

cors.allowed-origins=http://localhost:4200
